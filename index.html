<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💌 Reply For Pan</title>
 
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
 
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
 
  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
 
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    body {
      font-family: 'Padauk', sans-serif;
      background: linear-gradient(135deg, #ffe0ec 0%, #ffd1dc 50%, #ffc0cb 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== Swiper Gallery ===== */
    .gallery-screen {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .mySwiper {
      width: 100%;
      max-width: 420px;
      padding: 20px 0 60px 0;
    }
    .swiper-slide {
      background-position: center;
      background-size: cover;
      width: 280px;
      height: 380px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(255, 105, 180, 0.4);
      overflow: hidden;
      position: relative;
    }
    .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .swiper-slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(255, 105, 180, 0.3), transparent 60%);
      pointer-events: none;
    }
    .swiper-pagination-bullet {
      background: #ffb6c1;
      opacity: 0.5;
    }
    .swiper-pagination-bullet-active {
      background: #ff69b4;
      opacity: 1;
    }

    /* ===== Envelope ===== */
    .envelope-wrapper { perspective: 1000px; }
    .envelope { cursor: pointer; transition: transform 0.4s ease; }
    .envelope:hover { transform: scale(1.05) rotate(-2deg); }
    .flap { transform-origin: top; transition: transform 0.8s ease; }
    .envelope.open .flap { transform: rotateX(180deg); }

    .letter {
      background: #fffaf0;
      box-shadow: 0 10px 40px rgba(255, 105, 180, 0.3);
      border: 2px dashed #ffb6c1;
    }

    .fade-line {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s ease;
    }
    .fade-line.show { opacity: 1; transform: translateY(0); }

    /* Heart float */
    .heart-float {
      position: fixed;
      font-size: 24px;
      animation: floatUp 6s linear infinite;
      pointer-events: none;
      z-index: 999;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
    }

    /* Music button */
    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(255, 105, 180, 0.9);
      color: white;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.5);
      transition: all 0.3s;
    }
    .music-btn:hover { transform: scale(1.1); }
    .music-btn.playing { animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Next button glow */
    .glow-btn {
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.8),
                  0 0 40px rgba(255, 105, 180, 0.5);
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { box-shadow: 0 0 20px rgba(255, 105, 180, 0.6); }
      to { box-shadow: 0 0 30px rgba(255, 105, 180, 1), 0 0 50px rgba(255, 105, 180, 0.6); }
    }
  </style>
</head>
<body>

  <!-- 🎵 Background Music -->
  <audio id="bgMusic" loop>
    <source src="music/play.mp3" type="audio/mpeg">
  </audio>

  <!-- 🎵 Music Toggle -->
  <div id="musicBtn" class="music-btn" title="Music on/off">
    <span id="musicIcon">🔇</span>
  </div>

  <!-- ============================================
       ========== 1️⃣ GALLERY SCREEN ==========
       ============================================ -->
  <div id="galleryScreen" class="gallery-screen fixed inset-0 z-50">
   
    <h1 class="text-pink-300 text-xl md:text-2xl mb-4 font-bold tracking-wide text-center px-4">
       အပျင်းပြေကြည့်ဖို့ 👀
    </h1>

    <!-- Swiper -->
    <div class="swiper mySwiper">
      <div class="swiper-wrapper" id="swiperWrapper">
        <!-- JS က ပုံတွေ ထည့်ပေးမယ် -->
      </div>
      <div class="swiper-pagination"></div>
    </div>

    <button id="toEnvelopeBtn"
      class="glow-btn mt-6 px-8 py-3 bg-pink-500 hover:bg-pink-600 text-white rounded-full font-bold transition transform hover:scale-105">
      💌 စာဖွင့်ကြည့်မယ်
    </button>

    <p class="mt-3 text-pink-200 text-xs">ပုံလေးတွေ ကြည့်ပြီးရင် နှိပ်လိုက်နော်</p>
  </div>

  <!-- ============================================
       ========== 2️⃣ ENVELOPE SCREEN ==========
       ============================================ -->
  <div id="envelopeScreen" class="hidden envelope-wrapper text-center fixed inset-0 flex flex-col justify-center items-center p-4">
    <h1 class="text-pink-600 text-2xl mb-6 font-bold">💌 Reply For ပလစ်စိန် ဂျိန်းဖောသူလေး</h1>
   
    <div id="envelope" class="envelope relative w-72 h-52 mx-auto">
      <div class="absolute inset-0 bg-pink-300 rounded-lg shadow-2xl"></div>
      <div class="absolute left-4 right-4 top-4 bottom-4 bg-white rounded shadow-inner flex items-center justify-center">
        <span class="text-pink-400 text-sm">နှိပ်ကြည့်ပါ 💕</span>
      </div>
      <div class="flap absolute top-0 left-0 w-full h-1/2 bg-pink-400 rounded-t-lg"
           style="clip-path: polygon(0 0, 100% 0, 50% 100%);"></div>
      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-3xl z-10">❤️</div>
    </div>
   
    <p class="mt-6 text-pink-500 animate-pulse">စာအိတ်လေးကို နှိပ်လိုက်ပါ...</p>
  </div>

  <!-- ============================================
       ========== 3️⃣ QUESTION SCREEN ==========
       ============================================ -->
  <div id="questionScreen" class="hidden text-center max-w-md fixed inset-0 flex flex-col justify-center items-center p-4">
    <div class="letter rounded-2xl p-8">
      <p class="text-pink-500 text-sm mb-3">💗 ပန့်ရဲ့ မေးခွန်း 💗</p>
      <h2 class="text-xl md:text-2xl text-gray-700 leading-relaxed font-bold">
        "အကိုက ပန့်ကို ဘယ်လိုချစ်ခြင်းမျိုးနဲ့ ချစ်တာ"
      </h2>
      <button id="readBtn"
        class="mt-8 px-8 py-3 bg-pink-500 hover:bg-pink-600 text-white rounded-full shadow-lg transition transform hover:scale-105">
        အဖြေဖတ်မယ် 💌
      </button>
    </div>
  </div>

  <!-- ============================================
       ========== 4️⃣ ANSWER SCREEN ==========
       ============================================ -->
  <div id="answerScreen" class="hidden max-w-2xl w-full fixed inset-0 flex justify-center items-start p-4">
    <div class="letter rounded-2xl p-6 md:p-10 max-h-[85vh] overflow-y-auto w-full">
      <h2 class="text-center text-pink-500 text-xl mb-6 font-bold">🩷 စာရှည်လို့ ဒီလိုလေး ရေးလိုက်တာပါဗျာ 😁</h2>
     
      <div id="answerLines" class="space-y-5 text-gray-700 leading-loose text-base md:text-lg"></div>
     
      <div id="finalHeart" class="hidden text-center mt-8">
        <div class="text-5xl animate-bounce">💚</div>
        <p class="text-pink-500 mt-3 font-bold text-lg">ပန့်ကို အမြဲချစ်နေမဲ့ coco 💗</p>
      </div>
    </div>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
 
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="script.js"></script>
</body>
        </html>
